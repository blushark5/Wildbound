name: Wildbound creature incremental reboot

# v0.30 hard scope reset: only the real 3-creature 1v1 game is under active
# production. Preserve archived v0.14–29 source, but do not spend minutes
# validating old screenshots and mechanics on every tiny polish iteration.
on:
  push:
    branches: [feature/wildbound-bond-sprite-v14]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildbound-v30-duel-validation
  cancel-in-progress: true

jobs:
  godot-reboot:
    name: Validate and export Wildbound Duel
    runs-on: ubuntu-latest
    steps:
      - name: Check out three-creature duel game
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import original creature art and verify all scripts
        run: godot --headless --path . --editor --import --quit
      - name: Test actual 1v1 elemental combat, training, farming, bosses and Ascension
        run: timeout 90s godot --headless --path . --script res://tests/check_duel_v30.gd
      - name: Start the new game scene and catch initialization failures
        run: timeout 60s godot --headless --path . --quit-after 30
      - name: Capture five full-size Godot UI screenshots
        run: xvfb-run -a godot --path . --script res://tests/capture_duel_v30.gd
      - name: Archive rendered duel and upgrades for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-v30-duel-screen-review
          path: Docs/QA/wildbound_v30_*.png
      - name: Export browser-playable v0.30
        run: |
          mkdir -p "$RUNNER_TEMP/wildbound-v30"
          godot --headless --path . --export-release "Web" "$RUNNER_TEMP/wildbound-v30/index.html"
          test -s "$RUNNER_TEMP/wildbound-v30/index.html"
          test -s "$RUNNER_TEMP/wildbound-v30/index.wasm"
          test -s "$RUNNER_TEMP/wildbound-v30/index.pck"
          grep -aFq 'duel_engine_v30' "$RUNNER_TEMP/wildbound-v30/index.pck"
      - name: Archive actual web build
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-v30-browser-build
          path: \${{ runner.temp }}/wildbound-v30/
