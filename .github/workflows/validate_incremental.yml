name: Wildbound creature incremental reboot
on:
  push:
    branches: [feature/wildbound-true-visual-rebuild-v07]
  workflow_dispatch:

# Each feature-branch commit triggers validation; obsolete queued runs should
# never consume runners or delay the latest vetted game build.
concurrency:
  group: wildbound-v07-visual-branch-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated reboot branch
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import assets and check GDScript
        run: godot --headless --path . --editor --import --quit
      - name: Validate progression, persistent evolution and interface
        run: godot --headless --path . --script res://tests/check_incremental.gd
      - name: Validate full alpha engine, migration and interface
        run: godot --headless --path . --script res://tests/check_alpha.gd
      - name: Validate v0.3 tactics, elite enemies, contracts, camp and migration
        run: godot --headless --path . --script res://tests/check_v03.gd
      - name: Validate v0.4 specialization, combo, Guardian fury, caches and save migration
        run: godot --headless --path . --script res://tests/check_v04.gd
      - name: Validate original artwork integration and interactive battle UI
        run: godot --headless --path . --script res://tests/check_visual_v05.gd
      - name: Validate three-creature visual v0.6 battle and legacy UI
        run: godot --headless --path . --script res://tests/check_visual_v06.gd
      - name: Assert rebuilt v0.7 layout, combat controls and party presentation
        run: godot --headless --path . --script res://tests/check_visual_v07.gd
      - name: Render larger v0.7 battle-first interface
        run: xvfb-run -a godot --path . --script res://tests/capture_visual_v07.gd
      - name: Save genuine v0.7 rendered visual for review
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-v07-layout-review
          path: Docs/QA/wildbound_visual_v07*.png

      - name: Startup smoke test
        run: godot --headless --path . --quit-after 10
      - name: Capture actual rendered scene for visual review
        run: |
          if ! command -v Xvfb >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          xvfb-run -a godot --path . --script res://tests/capture_incremental.gd
      - name: Render real Alpha screenshot
        run: xvfb-run -a godot --path . --script res://tests/capture_alpha.gd
      - name: Archive Alpha screenshot for visual review
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-alpha-rendered-qa
          path: Docs/QA/wildbound_alpha.png
      - name: Capture real redesigned v0.6 stage
        run: xvfb-run -a godot --path . --script res://tests/capture_visual_v06.gd
      - name: Publish v0.6 rendered screenshot for review
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-v06-stage-visual-qa
          path: Docs/QA/wildbound_visual_v06.png
      - name: Upload actual screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-creature-ascension-visual-qa
          path: Docs/QA/wildbound_incremental.png
      - name: Export browser-playable game
        run: |
          mkdir -p /tmp/wildbound-idle-web
          godot --headless --path . --export-release "Web" /tmp/wildbound-idle-web/index.html
          test -s /tmp/wildbound-idle-web/index.html
          test -s /tmp/wildbound-idle-web/index.wasm
          test -s /tmp/wildbound-idle-web/index.pck
      - name: Upload browser-playable build without replacing Pages
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-creature-ascension-browser-prototype
          path: /tmp/wildbound-idle-web/
