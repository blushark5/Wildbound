name: Wildbound — Test and Publish

# Single production pipeline for the current three-creature 1v1 game.
# Historical preview builds remain in source control, but are no longer rebuilt.
on:
  push:
    branches:
      - feature/wildbound-bond-sprite-v14
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each new iteration supersedes the previous production build.
concurrency:
  group: wildbound-production-web
  cancel-in-progress: true

jobs:
  test-export-publish:
    name: Validate, Export and Publish Wildbound
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out active Wildbound game
        uses: actions/checkout@v4
        with:
          # Pin the triggering commit; manual runs use the latest active branch.
          ref: ${{ github.ref_name == 'feature/wildbound-bond-sprite-v14' && github.sha || 'feature/wildbound-bond-sprite-v14' }}

      - name: Install Godot Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import assets and scripts
        run: godot --headless --path . --editor --import --quit

      - name: Verify three-creature 1v1 combat and visual polish
        run: |
          grep -Fq 'run/main_scene="res://scenes/duel/wildbound_duel_v32.tscn"' project.godot
          timeout 90s godot --headless --path . --script res://tests/check_duel_v30.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v32.gd

      - name: Export one current browser build
        run: |
          mkdir -p "$RUNNER_TEMP/wildbound-site/duel" "$RUNNER_TEMP/wildbound-site/bond"
          godot --headless --path . --export-release "Web" "$RUNNER_TEMP/wildbound-site/duel/index.html"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.html"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.wasm"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          grep -aFq 'duel_ui_v32' "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          grep -aFq 'duel_engine_v30' "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          cp -a "$RUNNER_TEMP/wildbound-site/duel/." "$RUNNER_TEMP/wildbound-site/bond/"
          cmp "$RUNNER_TEMP/wildbound-site/duel/index.pck" "$RUNNER_TEMP/wildbound-site/bond/index.pck"

      - name: Add accurate build labels without changing Godot save identity
        env:
          SITE_ROOT: ${{ runner.temp }}/wildbound-site
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from datetime import datetime, timezone

          root = Path(os.environ['SITE_ROOT'])
          game = root / 'duel'
          html_path = game / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          opening = html.lower().find('<title>')
          closing = html.lower().find('</title>', opening)
          if opening < 0 or closing < 0:
              raise RuntimeError('Expected Godot HTML title missing')
          html_path.write_text(
              html[:opening] + '<title>Wildbound: Creature Ascension v0.32</title>'
              + html[closing + len('</title>'):],
              encoding='utf-8'
          )
          for destination in (game, root / 'bond'):
              if destination != game:
                  (destination / 'index.html').write_text(html_path.read_text(encoding='utf-8'), encoding='utf-8')
              (destination / 'build-info.txt').write_text(
                  'Wildbound v0.32 | Three-creature 1v1\n'
                  + 'Main scene: scenes/duel/wildbound_duel_v32.tscn\n'
                  + 'Commit: ' + os.environ['SOURCE_SHA'] + '\n'
                  + 'Built: ' + datetime.now(timezone.utc).isoformat() + '\n',
                  encoding='utf-8'
              )
          (root / 'index.html').write_text(
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<title>Wildbound</title>'
              '<meta http-equiv="refresh" content="0; url=duel/"></head>'
              '<body><p>Play <a href="duel/">Wildbound</a>.</p></body></html>',
              encoding='utf-8'
          )
          (root / '.nojekyll').write_text('', encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/wildbound-site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
