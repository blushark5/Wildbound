name: Wildbound Duel Publish

# This workflow lives on main to satisfy the GitHub Pages deployment environment.
# A lightweight source-branch validation triggers this after successful testing.
# Historical RPG and prototype builds stay in git; only the current 1v1 game is published.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Wildbound Duel Validation"]
    types: [completed]
    branches: [feature/wildbound-bond-sprite-v14]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wildbound-duel-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Export current duel and deploy Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out validated current duel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'feature/wildbound-bond-sprite-v14' }}

      - name: Install Godot with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import art and game scripts
        run: godot --headless --path . --editor --import --quit

      - name: Verify current duel, save namespace and core gameplay
        run: |
          grep -Fq 'run/main_scene="res://scenes/duel/wildbound_duel_v36.tscn"' project.godot
          grep -Fq 'wildbound_duel_v30.json' scripts/duel/duel_engine_v30.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v30.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v32.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v33.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v35.gd
          timeout 90s godot --headless --path . --script res://tests/check_duel_v36.gd

      - name: Export current browser game ONCE
        run: |
          mkdir -p "$RUNNER_TEMP/wildbound-site/duel" "$RUNNER_TEMP/wildbound-site/bond"
          godot --headless --path . --export-release "Web" "$RUNNER_TEMP/wildbound-site/duel/index.html"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.html"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.wasm"
          test -s "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          grep -aFq 'duel_ui_v36' "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          grep -aFq 'duel_engine_v30' "$RUNNER_TEMP/wildbound-site/duel/index.pck"
          cp -a "$RUNNER_TEMP/wildbound-site/duel/." "$RUNNER_TEMP/wildbound-site/bond/"

      - name: Stamp version into public pages without touching player saves
        env:
          SITE_ROOT: ${{ runner.temp }}/wildbound-site
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          from datetime import datetime, timezone

          root = Path(os.environ["SITE_ROOT"])
          duel = root / "duel"
          bond = root / "bond"
          html_file = duel / "index.html"
          html = html_file.read_text(encoding="utf-8")
          html, count = re.subn(r"<title>.*?</title>",
              "<title>Wildbound: Creature Ascension v0.36</title>", html,
              count=1, flags=re.DOTALL | re.IGNORECASE)
          if count != 1:
              raise RuntimeError("No title in Godot Web export")
          html_file.write_text(html, encoding="utf-8")
          (bond / "index.html").write_text(html, encoding="utf-8")
          info = ("Wildbound v0.36 | Three-creature 1v1\n"
                  "Main scene: scenes/duel/wildbound_duel_v36.tscn\n"
                  "Commit: " + os.environ["SOURCE_SHA"] + "\n"
                  "Published: " + datetime.now(timezone.utc).isoformat() + "\n")
          for place in (duel, bond):
              (place / "build-info.txt").write_text(info, encoding="utf-8")
          (root / "index.html").write_text(
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0; url=duel/">'
              '<title>Wildbound</title></head>'
              '<body>Play <a href="duel/">Wildbound</a>.</body></html>',
              encoding="utf-8")
          (root / ".nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/wildbound-site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
