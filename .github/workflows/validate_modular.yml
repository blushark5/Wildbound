name: Validate modular Willowrest foundation
on:
  push:
    branches: [feature/modular-willowrest-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modular-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout environment feature only
        uses: actions/checkout@v4
      - name: Install matching Godot and web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import illustrated source assets
        run: godot --headless --path . --editor --import --quit
      - name: Extract physical PNG atlas from approved Wildbound original artwork
        run: godot --headless --path . --script res://scripts/environment/bake_terrain.gd
      - name: Import modular assets and compile GDScript
        run: godot --headless --path . --editor --import --quit
      - name: Check tile layers, tree physics, movement and route connectivity
        run: godot --headless --path . --script res://tests/check_modular_environment.gd
      - name: Confirm existing game starts without regressions
        run: godot --headless --path . --quit-after 5
      - name: Attempt visual screenshot with real graphics renderer
        continue-on-error: true
        run: |
          if ! command -v Xvfb >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          xvfb-run -a godot --path . --script res://tests/capture_modular_scene.gd
      - name: Archive visual QA screenshot if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-willowrest-rendered-screenshot
          path: Docs/Art/qa/modular_scene_study.png
          if-no-files-found: ignore
      - name: Export isolated modular study for browser testing
        run: |
          sed -i 's@run/main_scene="res://main.tscn"@run/main_scene="res://scenes/environment/willowrest_modular_test.tscn"@' project.godot
          mkdir -p /tmp/wildbound-modular-web
          godot --headless --path . --export-release "Web" /tmp/wildbound-modular-web/index.html
          test -s /tmp/wildbound-modular-web/index.html
          test -s /tmp/wildbound-modular-web/index.wasm
          test -s /tmp/wildbound-modular-web/index.pck
      - name: Archive isolated browser playable
        uses: actions/upload-artifact@v4
        with:
          name: modular-willowrest-browser-study
          path: /tmp/wildbound-modular-web/
      - name: Commit extracted PNG on isolated feature only
        run: |
          git add assets/environment/terrain_study.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "art: extract 24px Willowrest modular terrain study"
            git push origin HEAD:feature/modular-willowrest-foundation
          fi
